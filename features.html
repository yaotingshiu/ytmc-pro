<style>
  :root {
    --bg: #0c0d10; --card: #15171c; --card2: #1c1f26; --line: rgba(var(--fg),.08); --line2: rgba(var(--fg),.15);
    --text: #f3f4f6; --text2: #d6d8dd; --sub: #9aa0aa; --green: #10b981; --green2: #34d399; --red: #ff3b3b;
    --gold: #f5c451; --gold2: #e0a526; --gold-t: #f5c451;
    --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1);
    --fg: 255,255,255; color-scheme: dark;
  }
  :root[data-theme="light"] { --fg: 20,24,32; color-scheme: light;
    --bg: #f4f5f8; --card: #ffffff; --card2: #eceef3; --line: rgba(20,24,32,.10); --line2: rgba(20,24,32,.20);
    --text: #14171c; --text2: #3a404b; --sub: #5b6371; --green: #059669; --green2: #047857; --gold-t: #a56c00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  html[lang="ja"] body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif; }
  html[lang="zh-CN"] body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(900px 520px at 15% -10%, rgba(245,196,81,.10), transparent 60%),
                radial-gradient(800px 520px at 100% 20%, rgba(16,185,129,.07), transparent 60%); }
  :root[data-theme="light"] body::before { opacity: .7; }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 22px; }
  #prog { position: fixed; top: 0; left: 0; height: 3px; width: 100%; transform-origin: 0 50%; transform: scaleX(0); z-index: 50;
    background: linear-gradient(90deg, var(--gold2), var(--gold), #fff1c4); }

  /* ---------- sticky top bar (shared by every page) ---------- */
  .topbar { position: sticky; top: 0; z-index: 40; backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px);
    border-bottom: 1px solid transparent; transition: background-color .3s, border-color .3s; }
  .topbar.stuck { background: color-mix(in srgb, var(--bg) 80%, transparent); border-bottom-color: var(--line); }
  .topbar .wrap { max-width: 1120px; }
  .topbar .top { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
  .topbar .home { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; border-radius: 12px; padding: 4px 8px 4px 4px; margin-left: -4px; transition: background .2s; }
  .topbar .home:hover { background: rgba(var(--fg),.05); }
  .topbar .home svg { width: 34px; height: 34px; flex: none; transition: transform .45s var(--spring); }
  .topbar .home:hover svg { transform: rotate(-8deg) scale(1.08); }
  .topbar .home b { font-size: 15px; letter-spacing: -.2px; line-height: 1.1; white-space: nowrap; }
  .topbar .home b .for { display: block; font-weight: 600; font-size: 11px; color: var(--sub); margin-top: 1px; }
  .nav { display: flex; gap: 4px; margin-left: 8px; }
  .nav a, .navm a { text-decoration: none; font-size: 13.5px; font-weight: 600; color: var(--sub); padding: 6px 12px; border-radius: 16px; transition: color .2s, background .2s; white-space: nowrap; }
  .nav a:hover { color: var(--text); background: rgba(var(--fg),.06); }
  .nav a.on { color: var(--text); background: rgba(var(--fg),.08); }
  .topbar .sp { flex: 1; }
  .topbar .theme-btn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--sub);
    display: grid; place-items: center; cursor: pointer; transition: color .2s, transform .35s var(--spring), border-color .2s; }
  .topbar .theme-btn:hover { color: var(--text); border-color: var(--line2); transform: rotate(-12deg) scale(1.06); }
  .topbar .theme-btn svg { width: 17px; height: 17px; }
  .topbar .theme-btn .moon { display: none; }
  :root[data-theme="light"] .topbar .theme-btn .sun { display: none; }
  :root[data-theme="light"] .topbar .theme-btn .moon { display: block; }
  .topbar .lang { position: relative; display: flex; flex: none; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 3px; }
  .topbar .lang .pill { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 16px; background: var(--card2);
    box-shadow: inset 0 0 0 1px var(--line2), 0 2px 8px rgba(0,0,0,.25); transition: transform .45s var(--spring), width .45s var(--spring); }
  :root[data-theme="light"] .topbar .lang .pill { box-shadow: inset 0 0 0 1px var(--line2), 0 2px 8px rgba(20,24,32,.12); }
  .topbar .lang button { position: relative; z-index: 1; border: 0; background: none; color: var(--sub); font: 600 12px inherit; white-space: nowrap;
    padding: 5px 11px; border-radius: 16px; cursor: pointer; transition: color .25s; }
  .topbar .lang button:hover, .topbar .lang button.on { color: var(--text); }
  :root[data-theme="light"] .topbar .home svg { filter: drop-shadow(0 1px 1.5px rgba(20,24,32,.55)) drop-shadow(0 0 .5px rgba(20,24,32,.6)); }
  .navm { display: none; justify-content: center; gap: 6px; padding-bottom: 10px; }
  .navm a { font-size: 13px; padding: 6px 14px; background: var(--card); border: 1px solid var(--line); }
  .navm a.on { color: var(--text); border-color: var(--line2); }
  @media (max-width: 860px) { .nav { display: none; } .navm { display: flex; } }
  @media (max-width: 520px) { .topbar .top { gap: 8px; padding: 10px 0; } .topbar .home b { display: none; } .topbar .lang button { padding: 5px 8px; } }


  /* ---------- reveal ---------- */
  .rv { opacity: 0; transform: translateY(34px) scale(.985); filter: blur(6px); transition: opacity .9s var(--ease), transform .9s var(--ease), filter .9s var(--ease); transition-delay: var(--d, 0s); }
  .rv.in { opacity: 1; transform: none; filter: none; }
  .grad { background: linear-gradient(100deg, #ffd36e, var(--gold) 40%, #ff9f43 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    background-size: 200% 100%; animation: gshift 7s ease-in-out infinite; }
  :root[data-theme="light"] .grad { background-image: linear-gradient(100deg, #f0a800, #e08a00 60%, #d46a00); }
  @keyframes gshift { 0%,100% { background-position: 0 0; } 50% { background-position: 100% 0; } }
  .eyebrow { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-t); margin-bottom: 14px; }
  h2.big { font-size: clamp(32px, 5.4vw, 60px); line-height: 1.12; letter-spacing: -1.5px; font-weight: 800; }
  html[lang="ja"] h2.big { letter-spacing: -.5px; font-size: clamp(28px, 4.6vw, 52px); }
  p.lead { color: var(--sub); font-size: clamp(16px, 1.8vw, 20px); line-height: 1.6; max-width: 660px; }
  .center { text-align: center; } .center p.lead { margin-left: auto; margin-right: auto; }

  /* ---------- hero ---------- */
  .hero { position: relative; padding: clamp(40px, 8vh, 90px) 0 0; text-align: center; --p: 0; }
  .hero h1 { font-size: clamp(40px, 7.6vw, 92px); line-height: 1.06; letter-spacing: -3px; font-weight: 800; }
  html[lang="ja"] .hero h1 { letter-spacing: -1px; font-size: clamp(26px, 7vw, 72px); }
  html[lang="en"] .hero h1 { font-size: clamp(38px, 7vw, 86px); }
  .hero h1 span { display: block; }
  .hero p.lead { margin: 24px auto 0; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font: 700 15px inherit; text-decoration: none; padding: 13px 26px; border-radius: 30px; border: 1px solid var(--line2);
    color: var(--text); background: rgba(var(--fg),.04); cursor: pointer; transition: transform .35s var(--spring), box-shadow .3s, background .2s; }
  .btn:hover { transform: translateY(-3px) scale(1.03); background: rgba(var(--fg),.08); }
  .btn.gold { color: #2a1d00; border-color: transparent; background: linear-gradient(110deg, var(--gold2), var(--gold) 35%, #fff1c4 50%, var(--gold) 65%, var(--gold2)); background-size: 250% 100%;
    animation: sheen 3.5s linear infinite; box-shadow: 0 10px 30px rgba(245,196,81,.28); }
  .btn.gold:hover { box-shadow: 0 16px 40px rgba(245,196,81,.4); }
  @keyframes sheen { 0% { background-position: 100% 0; } 100% { background-position: -150% 0; } }
  .btn svg { width: 16px; height: 16px; }
  .stage-h { position: relative; height: clamp(330px, 56vw, 640px); margin-top: 54px; perspective: 1400px; }
  .stage-h::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(900px, 96vw); aspect-ratio: 1.6; transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(245,196,81,.22), rgba(245,196,81,.06) 50%, transparent); animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .75; transform: translate(-50%,-50%) scale(.94); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); } }
  .shot { position: absolute; border-radius: 18px; overflow: hidden; background: #111318; border: 1px solid var(--line2);
    box-shadow: 0 40px 90px rgba(0,0,0,.45), 0 0 0 1px rgba(var(--fg),.04); }
  :root[data-theme="light"] .shot { box-shadow: 0 40px 80px rgba(20,24,40,.25); }
  .shot img { display: block; width: 100%; height: auto; }
  .hs { left: 50%; top: 0; will-change: transform; }
  .hs.c { width: min(840px, 92vw); z-index: 1; transform: translateX(-50%) rotateX(calc(14deg - var(--p) * 14deg)) translateY(calc(var(--p) * -30px)) scale(calc(.94 + var(--p) * .06)); transform-origin: 50% 100%; }
  .hs.l, .hs.r { width: min(250px, 27vw); top: 26%; z-index: 3; border-radius: 16px; }
  /* hover a hero shot: it grows and comes to the front, the others dim */
  .hs { transition: scale .5s var(--spring), filter .35s, box-shadow .35s; cursor: zoom-in; }
  .hs:hover { scale: 1.14; z-index: 6; box-shadow: 0 60px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(245,196,81,.45), 0 0 50px rgba(245,196,81,.18); }
  .hs.c:hover { scale: 1.06; }
  .stage-h:has(.hs:hover) .hs:not(:hover) { filter: brightness(.6) saturate(.8); }
  :root[data-theme="light"] .stage-h:has(.hs:hover) .hs:not(:hover) { filter: brightness(.85) saturate(.8); }
  .hs.l { transform: translateX(calc(-50% - min(400px, 40vw) - var(--p) * 60px)) translateY(calc(var(--p) * -60px)) rotate(calc(-5deg + var(--p) * 3deg)); }
  .hs.r { transform: translateX(calc(-50% + min(400px, 40vw) + var(--p) * 60px)) translateY(calc(var(--p) * -90px)) rotate(calc(5deg - var(--p) * 3deg)); }

  /* ---------- marquee ---------- */
  .marq { overflow: hidden; margin-top: 50px; padding: 18px 0; border-block: 1px solid var(--line); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
  .marq .tr { display: flex; gap: 14px; width: max-content; animation: slide 42s linear infinite; }
  .marq:hover .tr { animation-play-state: paused; }
  .marq span { font-size: 15px; font-weight: 700; padding: 8px 20px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); color: var(--text2); white-space: nowrap; }
  @keyframes slide { to { transform: translateX(-50%); } }

  /* ---------- move (scroll-driven) ---------- */
  .move { position: relative; height: 240vh; margin-top: clamp(40px, 8vh, 90px); }
  .move-in { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 34px; padding-top: 50px; }
  .board { position: relative; display: grid; grid-template-columns: 1fr 120px 1fr; align-items: center; max-width: 920px; margin: 0 auto; width: 100%; }
  .acct { position: relative; padding: 20px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.25); transition: border-color .4s, box-shadow .4s; }
  :root[data-theme="light"] .acct { box-shadow: 0 24px 50px rgba(20,24,40,.10); }
  .acct.new.full { border-color: rgba(16,185,129,.55); box-shadow: 0 24px 70px rgba(16,185,129,.18); }
  .acct h5 { display: flex; align-items: center; gap: 10px; font-size: 15px; margin-bottom: 14px; }
  .acct h5 .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: #fff; font-weight: 800; }
  .acct.old h5 .av { background: linear-gradient(135deg, #8b93a3, #5b6371); } .acct.new h5 .av { background: linear-gradient(135deg, #34d399, #059669); }
  .acct h5 .n { margin-left: auto; font-size: 12.5px; color: var(--sub); font-weight: 600; font-variant-numeric: tabular-nums; }
  .acct .lbl { font-size: 12px; color: var(--sub); font-weight: 700; margin: 4px 0 8px; }
  .slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .slots.p { grid-template-columns: repeat(4, 1fr); margin-top: 4px; }
  .move h2.big { font-size: clamp(28px, 4.2vw, 48px); }
  .slot { aspect-ratio: 1; border-radius: 50%; background: rgba(var(--fg),.05); border: 1px dashed rgba(var(--fg),.12); }
  .slots.p .slot { aspect-ratio: 16/9; border-radius: 10px; }
  .acct.old .slot { border: 0; background-size: cover; background-position: center; transition: opacity .3s, filter .3s; }
  .acct.old .slot.gone { opacity: .28; filter: grayscale(1); }
  .pipe { position: relative; height: 4px; margin: 0 10px; border-radius: 4px; background: rgba(var(--fg),.08); overflow: hidden; }
  .pipe i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(var(--mp, 0)); background: linear-gradient(90deg, var(--gold2), var(--gold), var(--green2)); }
  .tok { position: absolute; left: 0; top: 0; border-radius: 50%; background-size: cover; background-position: center; pointer-events: none; z-index: 4; will-change: transform; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
  .tok.p { border-radius: 8px; }

  /* ---------- sticky story ---------- */
  .head { padding: clamp(60px, 12vh, 130px) 0 20px; }
  .story-in { display: grid; grid-template-columns: minmax(0,.8fr) minmax(0,1.3fr); gap: 56px; align-items: start; }
  .step { min-height: 86vh; display: flex; flex-direction: column; justify-content: center; opacity: .28; transition: opacity .5s; }

    color: #2a1d00; background: linear-gradient(135deg, #ffd36e, var(--gold), var(--gold2)); }

  .stage::before { content: ""; position: absolute; width: 100%; aspect-ratio: 1; border-radius: 50%; transition: background .6s; background: radial-gradient(closest-side, rgba(245,196,81,.2), transparent); }
  .stage[data-a="1"]::before, .stage[data-a="6"]::before { background: radial-gradient(closest-side, rgba(16,185,129,.2), transparent); }
  .stage[data-a="2"]::before, .stage[data-a="7"]::before { background: radial-gradient(closest-side, rgba(170,130,255,.2), transparent); }
  .stage[data-a="3"]::before { background: radial-gradient(closest-side, rgba(59,156,255,.2), transparent); }
  .stage[data-a="4"]::before { background: radial-gradient(closest-side, rgba(255,120,120,.18), transparent); }
  .stage[data-a="5"]::before { background: radial-gradient(closest-side, rgba(120,220,170,.18), transparent); }
  .stage .shot { position: absolute; width: min(330px, 100%); opacity: 0; transform: translateY(40px) scale(.94) rotate(2deg); transition: opacity .6s var(--ease), transform .8s var(--ease); }
  .stage .shot.wide { width: 100%; }
  .stage .shot:not(.wide) img { max-height: 70vh; width: auto; max-width: 100%; margin: 0 auto; }
  .stage .shot.on { opacity: 1; transform: none; z-index: 2; }
  .zoom { cursor: zoom-in; }

  /* ---------- pro ---------- */
  .pro-sec { position: relative; margin-top: clamp(70px, 12vh, 140px); padding: clamp(60px, 10vh, 110px) 0; overflow: hidden; }
  .pro-sec::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(900px 500px at 50% 0, rgba(245,196,81,.16), transparent 62%), linear-gradient(180deg, transparent, rgba(var(--fg),.035) 30%, rgba(var(--fg),.035) 70%, transparent); }
  .crown { width: 74px; height: 58px; margin: 0 auto 18px; filter: drop-shadow(0 8px 20px rgba(245,196,81,.45)); animation: bob 3s ease-in-out infinite; }
  .crown svg { width: 100%; height: 100%; overflow: visible; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  .pcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 54px; perspective: 1200px; }
  .pc { position: relative; padding: 28px 24px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); overflow: hidden; --mx: 50%; --my: 0%;
    transition: transform .35s var(--ease), border-color .3s, box-shadow .35s; transform-style: preserve-3d; }
  .pc::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(360px circle at var(--mx) var(--my), rgba(245,196,81,.14), transparent 45%); }
  .pc:hover { border-color: rgba(245,196,81,.5); box-shadow: 0 24px 60px rgba(245,196,81,.12); }
  .pc:hover::before { opacity: 1; }
  .pc .ico { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; margin-bottom: 18px;
    background: linear-gradient(135deg, rgba(245,196,81,.2), rgba(245,196,81,.06)); color: var(--gold-t); border: 1px solid rgba(245,196,81,.3); }
  .pc .ico svg { width: 26px; height: 26px; }
  .pc h4 { font-size: 19px; letter-spacing: -.3px; line-height: 1.35; }

  .more { text-align: center; margin-top: 30px; color: var(--sub); font-size: 14px; }
  .more a { color: var(--gold-t); font-weight: 700; text-underline-offset: 3px; }

  /* ---------- privacy + stats ---------- */
  .priv { padding: clamp(80px, 13vh, 150px) 0 20px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 56px; }
  .stat { text-align: center; padding: 30px 12px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); }
  .stat b { display: block; font-size: clamp(40px, 6vw, 68px); line-height: 1; letter-spacing: -2px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat > span { display: block; margin-top: 10px; color: var(--sub); font-size: 14px; }

  /* ---------- video ---------- */
  .vsec { padding: clamp(80px, 13vh, 150px) 0 20px; }
  .vid { position: relative; max-width: 960px; margin: 48px auto 0; aspect-ratio: 16/9; border-radius: 26px; overflow: hidden; background: #000; border: 1px solid var(--line2);

  .vid iframe, .vid video, .vid .poster { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; object-fit: cover; }
  .poster { cursor: pointer; padding: 0; background: #000; }

  .poster:hover img { transform: scale(1.04); filter: brightness(.95); }
  .poster .play { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, #ffd36e, var(--gold) 50%, var(--gold2)); animation: pulse 2.4s ease-out infinite; transition: transform .3s var(--spring); }
  .poster:hover .play { transform: scale(1.1); }
  .poster .play svg { width: 36px; height: 36px; margin-left: 5px; color: #2a1d00; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(245,196,81,.5); } 100% { box-shadow: 0 0 0 36px rgba(245,196,81,0); } }

  /* ---------- final ---------- */
  .final { margin-top: clamp(80px, 12vh, 130px); padding: clamp(60px, 10vh, 100px) 24px; text-align: center; border-radius: 36px; position: relative; overflow: hidden;
    background: linear-gradient(160deg, rgba(245,196,81,.14), rgba(var(--fg),.03) 50%, rgba(16,185,129,.08)); border: 1px solid var(--line2); }
  .final .big-logo { width: 110px; height: 110px; margin: 0 auto 22px; animation: bob 4s ease-in-out infinite; }

  .final h2 { font-size: clamp(30px, 5vw, 56px); letter-spacing: -1.5px; line-height: 1.12; font-weight: 800; }
  .final p { color: var(--sub); margin: 14px auto 0; font-size: 18px; max-width: 620px; }
  footer { text-align: center; color: var(--sub); font-size: 12.5px; padding: 70px 0 40px; }
  footer nav { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
  footer a { color: var(--sub); text-decoration: none; transition: color .2s; }
  footer a:hover { color: var(--gold-t); }
  footer .disc { max-width: 720px; margin: 10px auto 0; font-size: 11.5px; opacity: .75; line-height: 1.7; }

  /* ---------- lightbox ---------- */
  .lb { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px; background: rgba(0,0,0,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity .3s; cursor: zoom-out; }
  .lb.on { opacity: 1; pointer-events: auto; }
  .lb img { max-width: min(1500px, 100%); max-height: 92vh; border-radius: 14px; box-shadow: 0 40px 100px rgba(0,0,0,.6); transform: scale(.94); transition: transform .4s var(--spring); }
  .lb.on img { transform: none; }

  html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
    transition-property: background-color, color, border-color, fill, stroke, box-shadow, text-shadow !important;
    transition-duration: .45s !important; transition-timing-function: ease !important; transition-delay: 0s !important; }

  @media (max-width: 860px) {
    .story-in { grid-template-columns: 1fr; gap: 0; }
    .stage { display: none; }

    .step .m-shot { display: block; position: relative; width: min(300px, 82%); margin: 30px auto 0; }

    .acct { padding: 12px; border-radius: 18px; } .acct h5 { font-size: 12.5px; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; } .acct h5 .av { width: 22px; height: 22px; font-size: 11px; }
    .acct h5 .n { width: 100%; margin-left: 0; font-size: 11.5px; } .acct .lbl { font-size: 11px; }

  }
